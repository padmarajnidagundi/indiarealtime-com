name: Integration Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'indiarealtime/**'
      - 'tests/**'
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install linters
        run: |
          pip install black flake8 mypy
      
      - name: Run black check
        run: black --check indiarealtime/ tests/
      
      - name: Run flake8
        run: flake8 indiarealtime/ tests/ --max-line-length=120
      
      - name: Run mypy
        run: mypy indiarealtime/ --ignore-missing-imports

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      
      - name: Run tests
        run: |
          pytest tests/ -v --cov=indiarealtime --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3

  integration-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: indiarealtime_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      
      - name: Run integration tests
        run: |
          if [ -d tests/integration ] && find tests/integration -type f -name 'test*.py' | grep -q .; then
            pytest tests/integration/ -v
          else
            echo "No integration tests found; skipping."
          fi
        env:
          DATABASE_HOST: localhost
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: indiarealtime_test

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Bandit security scan
        run: |
          pip install bandit bandit-sarif-formatter
          bandit -r indiarealtime/ -f sarif -o bandit-report.sarif || true
      
      - name: Upload security scan
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: bandit-report.sarif
